<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IP Switcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --bg-elevated: #0f0f11;
      --bg-card: #121214;
      --bg-hover: #18181b;
      --bg-input: #0a0a0c;

      --border: #1e1e22;
      --border-strong: #2a2a30;
      --border-accent: color-mix(in srgb, var(--accent) 35%, transparent);

      --text: #e4e4e7;
      --text-dim: #a1a1aa;
      --text-faint: #52525b;
      --text-ghost: #27272a;

      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;

      --accent: #10b981;
      --accent-dim: color-mix(in srgb, var(--accent) 15%, transparent);
      --accent-faint: color-mix(in srgb, var(--accent) 8%, transparent);
      --accent-glow: color-mix(in srgb, var(--accent) 25%, transparent);

      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;

      --shadow-sm: 0 1px 2px #00000040;
      --shadow: 0 4px 12px #00000050;
      --shadow-lg: 0 20px 50px -10px #00000080;

      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, 'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-feature-settings: "cv11", "ss01";
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
      overflow: hidden;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea, [contenteditable] { cursor: text; user-select: text; -webkit-user-select: text; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    button, input, select, a { -webkit-app-region: no-drag; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    .app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ═══ TITLE BAR ═══ */
    .titlebar {
      height: 44px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px 0 16px;
      flex-shrink: 0;
      -webkit-app-region: drag;
      position: relative; z-index: 10;
    }
    .titlebar-left { display: flex; align-items: center; gap: 10px; }
    .app-icon {
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, black));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .app-icon svg { width: 13px; height: 13px; color: #000; }
    .app-title { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: -0.01em; }
    .app-title .brand { color: var(--accent); transition: color 0.3s; }
    .app-signature { font-family: var(--font-mono); font-size: 9px; color: var(--text-ghost); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 6px; }

    .adapter-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px 4px 12px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim);
      -webkit-app-region: no-drag;
      transition: border-color 0.2s;
    }
    .adapter-chip:hover { border-color: var(--border-strong); }
    .adapter-chip .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .adapter-chip select {
      background: transparent; border: none; color: var(--text);
      font-family: inherit; font-size: inherit; outline: none;
      max-width: 160px; cursor: pointer;
    }
    .adapter-chip .current-ip { color: var(--text-faint); font-size: 10px; }
    .adapter-chip .refresh-btn {
      background: transparent; border: none; color: var(--text-faint);
      padding: 2px; display: flex; align-items: center; transition: color 0.15s;
    }
    .adapter-chip .refresh-btn:hover { color: var(--text); }

    .titlebar-tools { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; margin-right: 8px; }
    .tool-btn {
      width: 28px; height: 28px; background: transparent; border: none;
      border-radius: 6px; color: var(--text-faint);
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .tool-btn:hover { background: var(--bg-hover); color: var(--text); }

    .window-controls { display: flex; gap: 4px; -webkit-app-region: no-drag; }
    .window-control-btn {
      width: 28px; height: 28px; background: transparent; border: none;
      border-radius: 6px; color: var(--text-faint);
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .window-control-btn:hover { background: var(--bg-hover); color: var(--text); }
    .window-control-btn.close:hover { background: var(--danger); color: white; }

    /* ═══ BODY ═══ */
    .app-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 28px; position: relative; }

    /* ═══ SEARCH BAR ═══ */
    .search-bar {
      position: relative;
      margin-bottom: 14px;
    }
    .search-bar .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 14px 9px 36px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
      transition: all 0.15s;
    }
    .search-bar .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-faint);
    }
    .search-bar .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-faint); pointer-events: none;
      display: flex; align-items: center;
    }
    .search-bar .search-kbd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 9.5px;
      color: var(--text-faint);
      background: var(--bg-input); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 4px;
      pointer-events: none;
    }

    /* ═══ ACTIVE BANNER ═══ (igual que antes) */
    .active-banner {
      position: relative;
      background: linear-gradient(135deg, var(--bg-card), var(--bg-hover));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 20px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .active-banner::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent); box-shadow: 0 0 24px var(--accent);
      transition: background 0.3s;
    }
    .active-banner::after {
      content: ""; position: absolute; top: -50%; right: -20%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, var(--accent-faint), transparent 70%);
      pointer-events: none;
    }
    .active-eyebrow {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 10px; color: var(--accent);
      letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 8px; font-weight: 500;
      transition: color 0.3s;
    }
    .active-eyebrow::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      transition: background 0.3s;
    }
    .active-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .active-ip {
      font-family: var(--font-mono); font-size: 30px; font-weight: 700;
      letter-spacing: -0.03em; color: var(--accent); line-height: 1.1;
      text-shadow: 0 0 30px var(--accent-glow);
      transition: all 0.3s;
    }
    .active-meta { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; }
    .meta-value { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); }
    .port-row { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; position: relative; z-index: 1; }
    .active-actions { margin-top: 14px; position: relative; z-index: 1; display: flex; gap: 8px; flex-wrap: wrap; }

    .status-banner {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--warning);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      margin-bottom: 20px;
    }
    .status-banner.neutral { border-left-color: var(--text-faint); }
    .status-banner .status-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
    .status-banner .status-content { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .status-banner .status-ip { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--warning); letter-spacing: -0.02em; }
    .status-banner .status-sub { font-size: 11px; color: var(--text-dim); }

    .warn-bar {
      background: color-mix(in srgb, var(--warning) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent);
      border-radius: var(--radius-sm);
      padding: 10px 14px; margin-bottom: 16px;
      font-size: 11.5px; color: var(--warning); font-family: var(--font-mono);
    }

    /* ═══ PROFILES GRID ═══ */
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .section-head-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.15em; text-transform: uppercase; }
    .section-head-count { color: var(--accent); margin-left: 6px; transition: color 0.3s; }
    .section-head-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .profiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .profile-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .profile-card.is-active {
      border-color: var(--border-accent);
      background: linear-gradient(135deg, var(--bg-card), var(--accent-faint));
    }
    .profile-card .color-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--card-color, var(--accent)); border-radius: var(--radius) 0 0 var(--radius); }
    .profile-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .profile-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-ghost); flex-shrink: 0; transition: all 0.3s; }
    .profile-card.is-active .profile-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .profile-name { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-ip { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); margin-bottom: 2px; }
    .profile-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); display: flex; gap: 12px; flex-wrap: wrap; }
    .profile-ports { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .profile-actions { display: flex; gap: 6px; margin-top: 12px; }
    .profile-shortcut {
      position: absolute; top: 10px; right: 12px;
      font-family: var(--font-mono); font-size: 9px;
      color: var(--text-faint);
      background: var(--bg-input); border: 1px solid var(--border);
      padding: 1px 5px; border-radius: 3px;
      letter-spacing: 0.05em;
    }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 8px; border-radius: 4px;
      font-family: var(--font-mono); font-size: 9px;
      letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
      margin-left: auto;
    }
    .badge-success { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--border-accent); }

    /* Port tag */
    .port-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 5px;
      font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim);
      transition: all 0.15s; cursor: pointer;
    }
    .port-tag:hover { border-color: var(--border-accent); color: var(--text); }
    .port-tag .port-num { color: var(--accent); font-weight: 600; transition: color 0.3s; }
    .port-tag svg { width: 10px; height: 10px; opacity: 0.5; }

    /* ═══ BUTTONS ═══ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm);
      font-family: var(--font-sans); font-size: 12.5px; font-weight: 500;
      letter-spacing: -0.005em; transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent; white-space: nowrap;
      position: relative; overflow: hidden; background: transparent;
    }
    .btn:disabled { cursor: not-allowed; opacity: 0.5; }
    .btn-primary { background: var(--accent); color: #0a0a0a; font-weight: 600; box-shadow: var(--shadow-sm); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 0 20px -2px var(--accent-glow), var(--shadow); transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-secondary { background: var(--bg-card); color: var(--text); border-color: var(--border-strong); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--text-faint); }
    .btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }
    .btn-danger { background: transparent; color: var(--text-faint); border-color: var(--border); }
    .btn-danger:hover:not(:disabled) {
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 40%, transparent);
    }
    .btn-destructive { background: var(--danger); color: white; font-weight: 600; }
    .btn-destructive:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 85%, white); }
    .btn-active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-accent); cursor: default; }
    .btn-active:hover { transform: none; }
    .btn-loading { background: color-mix(in srgb, var(--accent) 20%, var(--bg-card)); color: var(--text-dim); cursor: wait; }
    .btn-loading::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
      animation: shimmer 1.5s infinite;
    }
    .btn-icon { width: 32px; padding: 0; aspect-ratio: 1; flex-shrink: 0; }
    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-lg { padding: 10px 18px; font-size: 13.5px; }
    .btn-full { width: 100%; }

    /* ═══ KEBAB MENU (contextual) ═══ */
    .menu-popover {
      position: absolute; right: 0; top: calc(100% + 4px);
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 4px;
      box-shadow: var(--shadow-lg);
      z-index: 150;
      min-width: 180px;
      animation: menuIn 0.12s ease-out;
    }
    .menu-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 7px 10px;
      background: transparent; border: none;
      color: var(--text-dim); font-family: var(--font-sans);
      font-size: 12px; text-align: left;
      border-radius: 4px; transition: all 0.12s;
    }
    .menu-item:hover { background: var(--bg-hover); color: var(--text); }
    .menu-item.danger { color: var(--text-faint); }
    .menu-item.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .menu-item svg { width: 13px; height: 13px; opacity: 0.7; flex-shrink: 0; }
    .menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

    /* ═══ INPUTS ═══ */
    .input-group { margin-bottom: 12px; }
    .input-label { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; font-weight: 500; }
    .input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 12px;
      color: var(--text); font-family: var(--font-mono); font-size: 12.5px;
      outline: none; transition: all 0.15s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
    .input::placeholder { color: var(--text-faint); }

    /* ═══ FORM ═══ */
    .form-wrap { max-width: 560px; }
    .form-back { background: transparent; border: none; color: var(--text-faint); font-family: var(--font-sans); font-size: 12px; padding: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 6px; transition: color 0.15s; }
    .form-back:hover { color: var(--text-dim); }
    .form-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .form-subtitle { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* Color picker */
    .color-picker { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
    .color-swatches { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin-bottom: 10px; }
    .mini-swatch { aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; background: var(--_c); }
    .mini-swatch:hover { transform: scale(1.15); }
    .mini-swatch.selected { border-color: var(--text); transform: scale(1.1); box-shadow: 0 0 0 2px var(--bg-input), 0 0 0 3px var(--_c); }
    .color-custom { display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid var(--border); align-items: center; }
    .color-custom input[type=color] { width: 32px; height: 32px; border: 1px solid var(--border-strong); border-radius: 6px; background: transparent; padding: 0; }
    .color-custom input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
    .color-custom input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }
    .color-hex { flex: 1; text-transform: uppercase; }

    /* Port list */
    .port-list-item { display: grid; grid-template-columns: 100px 1fr 32px; gap: 8px; margin-bottom: 8px; align-items: center; }
    .port-list-item .input { padding: 7px 10px; font-size: 12px; }
    .port-delete-btn { background: transparent; border: none; color: var(--text-ghost); width: 32px; height: 32px; border-radius: 5px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .port-delete-btn:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
    .add-port-btn {
      width: 100%; padding: 8px; background: transparent;
      border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
      color: var(--text-faint); font-size: 11.5px; font-family: var(--font-sans);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s;
    }
    .add-port-btn:hover { border-color: var(--border-accent); color: var(--text-dim); }

    /* ═══ MODAL ═══ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: color-mix(in srgb, black 60%, transparent);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; animation: fadeIn 0.15s ease-out;
    }
    .modal {
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 24px; max-width: 420px; width: 90%;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 86vh; overflow-y: auto;
    }
    .modal.modal-wide { max-width: 560px; }
    .modal-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .modal-subtitle { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 20px; }
    .modal-body { font-size: 12.5px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; }

    /* ═══ TOAST ═══ */
    .toast {
      position: fixed; bottom: 48px; right: 24px;
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12.5px; color: var(--text);
      box-shadow: var(--shadow-lg);
      max-width: 420px; z-index: 200;
      animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .toast.success { border-color: var(--border-accent); }
    .toast.success .icon { color: var(--accent); font-weight: 700; }
    .toast.danger { border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    .toast.danger .icon { color: var(--danger); font-weight: 700; }

    /* ═══ FOOTER ═══ */
    .footer {
      height: 32px; background: var(--bg); border-top: 1px solid var(--border);
      padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; color: var(--text-ghost);
      font-family: var(--font-mono); flex-shrink: 0;
    }
    .footer a { color: var(--accent); text-decoration: none; font-weight: 600; transition: all 0.2s; }
    .footer a:hover { text-shadow: 0 0 10px var(--accent-glow); }
    .footer .sep { color: var(--text-ghost); margin: 0 2px; }

    .empty-state { grid-column: 1 / -1; text-align: center; color: var(--text-faint); font-size: 12.5px; padding: 60px 0; font-family: var(--font-mono); }
    .loading-screen { height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }

    /* ═══ QUICK SWITCHER ═══ */
    .quick-overlay {
      position: fixed; inset: 0;
      background: color-mix(in srgb, black 70%, transparent);
      backdrop-filter: blur(8px);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 15vh;
      z-index: 300;
      animation: fadeIn 0.12s ease-out;
    }
    .quick-box {
      width: 90%; max-width: 560px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: quickIn 0.16s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .quick-input-wrap { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .quick-input-wrap svg { color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; transition: color 0.3s; }
    .quick-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--font-sans); font-size: 16px;
      letter-spacing: -0.01em;
    }
    .quick-input::placeholder { color: var(--text-faint); }
    .quick-kbd { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); background: var(--bg-input); border: 1px solid var(--border); padding: 2px 6px; border-radius: 3px; }
    .quick-list { max-height: 50vh; overflow-y: auto; padding: 8px; }
    .quick-item {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.1s;
    }
    .quick-item:hover, .quick-item.selected { background: var(--bg-hover); }
    .quick-item.selected { background: var(--accent-faint); }
    .quick-item-bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--_c); flex-shrink: 0; }
    .quick-item-info { flex: 1; min-width: 0; }
    .quick-item-name { font-size: 13px; font-weight: 600; }
    .quick-item-ip { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .quick-item-badge { font-family: var(--font-mono); font-size: 9px; color: var(--accent); background: var(--accent-dim); border: 1px solid var(--border-accent); padding: 2px 6px; border-radius: 3px; letter-spacing: 0.08em; }
    .quick-empty { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 12px; font-family: var(--font-mono); }
    .quick-footer { padding: 10px 20px; border-top: 1px solid var(--border); display: flex; gap: 18px; font-family: var(--font-mono); font-size: 9.5px; color: var(--text-faint); }
    .quick-footer strong { color: var(--text-dim); font-weight: 500; }

    /* ═══ PING RESULTS ═══ */
    .ping-grid {
      display: grid; gap: 10px; margin-top: 6px;
    }
    .ping-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 14px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .ping-row .ping-label {
      font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
      letter-spacing: 0.1em; text-transform: uppercase;
      min-width: 80px;
    }
    .ping-row .ping-host { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); flex: 1; }
    .ping-row .ping-result { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
    .ping-row.success .ping-result { color: var(--accent); }
    .ping-row.error .ping-result { color: var(--danger); }
    .ping-row.pending .ping-result { color: var(--text-faint); }

    /* ═══ SETTINGS ═══ */
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-info { flex: 1; }
    .setting-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .setting-desc { font-size: 11px; color: var(--text-faint); }

    .toggle {
      position: relative; width: 36px; height: 20px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 999px; cursor: pointer;
      transition: all 0.2s; flex-shrink: 0;
    }
    .toggle::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-faint); transition: all 0.2s;
    }
    .toggle.on {
      background: var(--accent-dim);
      border-color: var(--border-accent);
    }
    .toggle.on::after { left: 18px; background: var(--accent); }

    /* ═══ HISTORY ═══ */
    .history-list {
      max-height: 50vh; overflow-y: auto;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .history-row {
      display: grid; grid-template-columns: auto 1fr auto;
      gap: 14px; padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 11px;
      align-items: center;
    }
    .history-row:last-child { border-bottom: none; }
    .history-time { color: var(--text-faint); font-size: 10px; white-space: nowrap; }
    .history-main { color: var(--text-dim); }
    .history-main strong { color: var(--text); }
    .history-icon.success { color: var(--accent); }
    .history-icon.error { color: var(--danger); }
    .history-empty { padding: 40px; text-align: center; color: var(--text-faint); font-size: 12px; font-family: var(--font-mono); }

    /* ═══ ABOUT ═══ */
    .about-logo {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, black));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow);
      margin: 0 auto 16px;
    }
    .about-logo svg { width: 28px; height: 28px; color: #000; }
    .about-name { text-align: center; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 2px; }
    .about-version { text-align: center; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); margin-bottom: 18px; }
    .about-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-family: var(--font-mono); font-size: 11px; padding: 14px; background: var(--bg-card); border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 16px; }
    .about-kv .k { color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; font-size: 9.5px; align-self: center; }
    .about-kv .v { color: var(--text-dim); }
    .about-author { text-align: center; font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
    .about-author a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .about-author a:hover { text-shadow: 0 0 10px var(--accent-glow); }

    /* ═══ MONITOR / WATCHLIST ═══ */
    .watch-section {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      position: relative; z-index: 1;
    }
    .watch-head {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; user-select: none;
      padding: 4px 0;
    }
    .watch-title {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 10px;
      color: var(--text-faint); letter-spacing: 0.12em; text-transform: uppercase;
    }
    .watch-summary {
      font-family: var(--font-mono); font-size: 11px;
      font-weight: 600;
    }
    .watch-summary .ok { color: var(--accent); }
    .watch-summary .warn { color: var(--warning); }
    .watch-summary .bad { color: var(--danger); }
    .watch-summary .dim { color: var(--text-faint); }
    .watch-chevron {
      margin-left: auto;
      color: var(--text-faint);
      transition: transform 0.2s;
      display: flex; align-items: center;
    }
    .watch-chevron.open { transform: rotate(90deg); }
    .watch-refresh {
      background: transparent; border: none;
      color: var(--text-faint); padding: 4px;
      display: flex; align-items: center;
      transition: color 0.15s;
    }
    .watch-refresh:hover { color: var(--text); }
    .watch-refresh.spinning { animation: spin 0.8s linear infinite; }

    .watch-list {
      margin-top: 8px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .watch-row {
      display: grid;
      grid-template-columns: 16px 120px 1fr auto auto;
      gap: 12px; align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 11px;
      transition: background 0.15s;
    }
    .watch-row:last-child { border-bottom: none; }
    .watch-row:hover { background: var(--bg-hover); }
    .watch-row.alive .watch-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .watch-row.dead .watch-dot { background: var(--text-ghost); box-shadow: none; }
    .watch-row.unknown .watch-dot { background: var(--text-faint); box-shadow: none; opacity: 0.5; animation: pulse 1.5s ease-in-out infinite; }
    .watch-dot {
      width: 8px; height: 8px; border-radius: 50%;
      justify-self: center;
      transition: all 0.3s;
    }
    .watch-row .watch-ip { color: var(--text); font-weight: 600; }
    .watch-row.dead .watch-ip { color: var(--text-faint); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--danger) 60%, transparent); }
    .watch-row .watch-label { color: var(--text-dim); font-family: var(--font-sans); font-size: 12px; }
    .watch-row .watch-latency { color: var(--accent); font-size: 10.5px; }
    .watch-row .watch-lastseen { color: var(--text-faint); font-size: 9.5px; letter-spacing: 0.05em; }
    .watch-row.dead .watch-lastseen { color: color-mix(in srgb, var(--danger) 80%, var(--text-faint)); }

    .watch-empty {
      padding: 16px; text-align: center;
      color: var(--text-faint); font-size: 11px;
      font-family: var(--font-mono);
    }

    /* ═══ Watchlist editor en formulario ═══ */
    .watchlist-editor {
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px;
    }
    .watchlist-item {
      display: grid;
      grid-template-columns: 1fr 1fr 32px;
      gap: 8px; align-items: center;
      margin-bottom: 8px;
    }
    .watchlist-item .input { padding: 7px 10px; font-size: 12px; }
    .watchlist-actions {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .scan-modal { max-width: 680px; }
    .scan-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .scan-progress-wrap {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px;
    }
    .scan-progress-top {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-mono); font-size: 11px; margin-bottom: 8px;
    }
    .scan-progress-label { color: var(--text-dim); }
    .scan-progress-label strong { color: var(--accent); font-weight: 700; }
    .scan-progress-count { color: var(--text-faint); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
    .scan-progress-bar { height: 3px; background: var(--bg-input); border-radius: 2px; overflow: hidden; }
    .scan-progress-fill {
      height: 100%; background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.2s ease-out;
    }
    .scan-list {
      max-height: 48vh; overflow-y: auto;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .scan-row {
      display: grid;
      grid-template-columns: 120px 150px 1fr auto;
      gap: 14px; padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 11px;
      align-items: center;
      transition: background 0.1s;
    }
    .scan-row:last-child { border-bottom: none; }
    .scan-row:hover { background: var(--bg-hover); }
    .scan-row.new-device { animation: flashIn 0.4s ease-out; }
    .scan-row .scan-ip { color: var(--text); font-weight: 600; }
    .scan-row .scan-ip.gateway { color: var(--accent); }
    .scan-row .scan-ip.self { color: var(--warning); }
    .scan-row .scan-mac { color: var(--text-dim); font-size: 10.5px; }
    .scan-row .scan-mac.empty { color: var(--text-ghost); }
    .scan-row .scan-vendor { color: var(--text-dim); font-family: var(--font-sans); font-size: 11.5px; }
    .scan-row .scan-hostname { color: var(--text-faint); font-size: 10.5px; margin-top: 2px; }
    .scan-row .scan-tags { display: flex; gap: 6px; align-items: center; }
    .scan-tag {
      font-family: var(--font-mono); font-size: 9px; font-weight: 600;
      padding: 2px 6px; border-radius: 3px; letter-spacing: 0.08em;
    }
    .scan-tag.gateway { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--border-accent); }
    .scan-tag.self { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent); }
    .scan-row .use-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-faint); padding: 3px 8px; border-radius: 4px;
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em;
      transition: all 0.15s;
    }
    .scan-row .use-btn:hover { color: var(--accent); border-color: var(--border-accent); background: var(--accent-faint); }
    .scan-empty-row {
      padding: 40px 20px; text-align: center;
      color: var(--text-faint); font-size: 11.5px; font-family: var(--font-mono);
    }
    .scan-summary {
      display: flex; gap: 16px; margin-top: 10px;
      font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
      letter-spacing: 0.08em;
    }
    .scan-summary strong { color: var(--text-dim); font-weight: 600; }

    @keyframes flashIn {
      0% { background: var(--accent-faint); }
      100% { background: transparent; }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes quickIn { from { opacity: 0; transform: scale(0.96) translateY(-12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
